{%- assign afterevent = site.data.afterevent[page.lang] -%}
<section id="afterevent" class="section-pink">
  <div class="wrapper">
    <article>
      <h1>{{ afterevent.title }}</h1>
      <p>{{ afterevent.description }}</p>
      <p>{{ afterevent.disclaimer }}</p>
    </article>
    <iframe width="100%" height="450" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"
      src="https://www.openstreetmap.org/export/embed.html?bbox=-0.33062%2C39.45437%2C-0.32662%2C39.45837&amp;layer=mapnik&amp;marker=39.456375%2C-0.328627"
      style="border: 1px solid black"></iframe>
    <br/>
    <small><a href="https://www.openstreetmap.org/?mlat=39.456375&amp;mlon=-0.328627#map=19/39.456375/-0.328627&amp;layers=N">{{ afterevent.map_link_text }}</a></small>
  </div>
</section>
