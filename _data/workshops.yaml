- startTime: "9:30"
  endTime: "11:30"
  room: Nexo
  registrationLink: "https://www.meetup.com/vlctechhub/events/314814891/?utm_medium=referral&utm_campaign=share-btn_savedevents_share_modal&utm_source=link&utm_version=v2&member_id=182751113"
  title: "VLCTechFest Robot Race"
  description: |-
    En el mundo de la robótica maker, los robots siguelíneas y los sumos son las auténticas estrellas de la pista. Pero, ¿quién es el mejor estratega en casa? En este taller, padres, madres e hijos formarán un equipo de ingeniería para enfrentarse a un reto trepidante: construir y programar su propio TuriaBot.

    El objetivo es sencillo pero emocionante: crear un robot siguelíneas basado en ESP32 y optimizar su código para que sea el más veloz de la competición. No os preocupéis por la complejidad técnica; el robot se entrega desmontado y no requiere soldadura. Solo necesitaréis vuestra destreza combinando bridas, cinta de doble cara, un poco de ingenio (y quizás un chicle) para ponerlo a punto.

    La jornada culminará en una vibrante contrarreloj eliminatoria donde vuestra creación tendrá que demostrar su precisión en varios circuitos. ¿Seréis capaces de trabajar en equipo para conquistar el podio?
  speaker:
    - name: "Sara Martínez"
      bio: "Sara Martínez es ingeniera experta en ciberseguridad con más de 10 años dedicándose a la calidad de software. Además de su trabajo, está metida en el mundo Meetup y maker de Valencia, habiendo participado en anteriores ediciones de VLCTechFest y colaborando con otros eventos en ciudades como AsturCONTech o Hackén."
      photo: /images/speakers/saraMartinez.jpeg
      links:
        - https://testingsoul.com/
    - name: "Pablo Trujillo"
      bio: "Pablo Trujillo es desarrollador de FPGA con más de 10 años diseñando e implementando algoritmos de control en FPGA. Además de su trabajo, está metido en el mundo Meetup y maker de Valencia, habiendo participado en anteriores ediciones de VLCTechFest y colaborando con otros eventos en ciudades como AsturCONTech o Hackén."
      skip: true

- startTime: "9:30"
  endTime: "11:30"
  room: Ágora
  title: "Consejos para que tu equipo compile: motivación, acuerdos y gestión de conflictos."
  description: |-
    Escribir buen código es solo una parte del trabajo. La otra, la que nadie te enseña, es construir un equipo que funcione cuando las cosas se complican.

    En este taller exploramos las dinámicas humanas que determinan si un equipo arranca o se atasca: cómo establecer acuerdos desde el principio, qué necesitamos y qué podemos ofrecer cuando hay tensión, y cómo identificar y resolver conflictos antes de que bloqueen al equipo.

    Sesión práctica en la que los asistentes se llevan herramientas para utilizar desde ese día con su equipo, y hasta con su pareja.
  speaker:
    - name: "Sonia Montagud"
      bio: |-
        Sonia Montagud
        Estrategia, TecnologIA y Personas

        Ingeniera Informática (especialidad IA y Software), Máster en Ingeniería del Software por la Universidad Politécnica de Valencia (UPV) y Máster en Administración de Startups por la UPV y University of California, Berkeley. Coach certificada por la Universidad Francisco de Vitoria (Madrid) y ORSC.

        Amplia experiencia en gestión de proyectos y productos, innovación, liderazgo, diseño organizacional y cultura en grandes organizaciones, como CaixaBank, Orange, Fujitsu, Banco Santander.

        Mentora en programas de emprendimiento como el Cybersecurity Startup Program organizado por Startup Valencia e Incibe.
      photo: /images/speakers/sonia_montagud.jpeg
      links:
        - https://www.linkedin.com/in/soniamontagud/

