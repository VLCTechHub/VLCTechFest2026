- startTime: "12:00"
  endTime: "14:00"
  room: Ágora
  title: "Mi primer Phising"
  description: |-
    ¿Somos capaces de crear un phishing "a mano"? ¿Sin ningún kit preparado ni herramientas sofisticadas?. En este taller lo vamos a preparar, empezando desde cero y con un ordenador cualquiera.

    Montar un phishing nos da una visión amplia y en profundidad de los mecanismos de seguridad más habituales. Nos ayudará a entenderlos y a utilizarlos correctamente. Evidentemente no queremos atacar a nadie con el phishing que preparemos. Lo que queremos es repasar la tecnología presente en este tipo de ataques, que se mantiene efectivo e inmune al paso del tiempo.

    A todos no suenan los mecanismos que nos protegen en el día a día: DMARC, HSTS, certificados digitales... pero ¿los entendemos bien? ¿nos hemos parado lo suficiente para dominarlos?

    Durante el taller se revisarán los siguientes protocolos: HTTP, HTML, HTTPS, HSTS, SMTP, SPF, DKIM, DMARC, ARC, DNS, DNSSEC, DoH, S/MIME...
  speaker:
    - name: "Miguel Macías Enguídanos"
      bio: "Ingeniero informático con muchos años de experiencia en el sector (pasando por la empresa privada, la administración central, universidades...). Colaborando en proyectos de código abierto y dando charlas e impartiendo docencia en el ámbito de la seguridad, la identidad digital y la programación"
      photo: /images/speakers/miguel_macias.jpeg

