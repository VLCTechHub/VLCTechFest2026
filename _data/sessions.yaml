- startTime: "17:00"
  endTime: "18:00"
  room: Sala Factoría
  language: "es"
  title: "Señales y papel de aluminio. Un viaje por lo invisible."
  description: |-
    Vivimos en un mundo hiperconectado, sumergidos en un océano de datos que viajan por el aire de forma invisible. Aunque nos parezca un caos, estas señales circulan por "autopistas" perfectamente organizadas que conocemos como frecuencias. Pero, ¿qué está ocurriendo realmente a nuestro alrededor en este preciso instante?

    En esta charla, viajaremos a través del espectro radioeléctrico para descubrir quiénes son los inquilinos de estas bandas. Partiremos desde los 27 MHz, territorio de la radioafición y el radiocontrol, hasta alcanzar los 5 GHz, donde la alta velocidad del Wi-Fi moderno domina el aire. Por el camino, exploraremos señales de aviación (Mode S), dispositivos cotidianos en la banda ISM y el complejo ecosistema de los 2.4 GHz.

    Más allá de la teoría, descubriremos las herramientas y técnicas necesarias para "hacer visible lo invisible". Mediante el uso de dispositivos SDR (Software Defined Radio), realizaremos capturas en vivo para demostrar que, con el equipo adecuado, cualquiera puede sintonizar la sinfonía digital que nos rodea.

    Al final de la charla se repartirá papel de aluminio al que lo desee para hacerse un gorro de protección.
  speaker:
    - name: "Pablo Trujillo"
      bio: "Diseñador de FPGA por más de 10 años, se dedica a la implementación de algoritmos de control. Además de su trabajo, Pablo comparte proyectos en su blog controlpaths, además de participar en otras páginas como Hackaday o Hackster. Pablo también ha dado charlas en diferentes eventos como CriptoredCon, Embedded World o el creators stage de DEFCON."
      photo: /images/speakers/pabloTrujillo.jpeg
      links:
        - https://controlpaths.com/

- startTime: "17:00"
  endTime: "18:00"
  room: Sala Visual
  language: "es"
  title: "“No era como pensábamos”: cuando las hipótesis UX se refutan y eso es lo mejor que nos puede pasar"
  description: |-
    En muchos equipos de producto, el UX Research se utiliza para “validar” ideas. Pero ¿qué pasa cuando las personas usuarias no confirman nuestras hipótesis, sino que las contradicen por completo?

    En esta charla compartiré un caso real en el que partíamos de una premisa aparentemente sólida: los padres quieren tener mayor control sobre las cuentas financieras de sus hijos en una billetera digital. Sin embargo, la investigación reveló algo muy distinto: más que control, buscaban confianza, visibilidad y educación financiera.

    A partir de este ejemplo, exploraremos por qué refutar hipótesis no es un fallo del research, sino uno de sus mayores aportes a la usabilidad y a la toma de decisiones de producto. Veremos cómo gestionar la tensión que surge cuando los hallazgos desafían las expectativas de stakeholders, y cómo transformar esa disconformidad en oportunidades concretas de diseño.

    La sesión propone un cambio de mindset: pasar de investigar para confirmar, a investigar para descubrir. Porque muchas veces, lo más valioso no es validar que vamos en la dirección correcta, sino darnos cuenta a tiempo de que no lo estamos.

    Al finalizar, las personas asistentes se llevarán:

    - –Estrategias para diseñar investigaciones orientadas al descubrimiento real.
    - –Claves para comunicar hallazgos incómodos de forma efectiva.
    - –Enfoques para transformar un “esto no funciona” en decisiones de producto claras y accionables.
  speaker:
    - name: "Sabrina Nuñez"
      bio: "Sabrina es UX Researcher. Estudió la carrera de Diseño industrial en la Universidad de Buenos Aires donde descubrió su pasión por entender las necesidades cotidianas de las personas en relación a los productos. Trabajó en entornos multiculturales tanto en empresas nacionales como internacionales. Es speaker y mentora en +Mujeres en UX LATAM y disfruta convertir la voz del usuario en historias que impulsan decisiones."
      photo: /images/speakers/sabrinaNuñez.jpg
      links:
        - https://www.linkedin.com/in/aitana-francés-293a88208

