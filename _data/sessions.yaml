  room: Sala Polivalente
  language: "es"
  title: "Código abierto en el mundo de los videojuegos"
  description: |-
    El código abierto es muy popular en la industria de la tecnología, pero el mundo de los videojuegos sigue viviendo en el pasado. En esta charla quiero explicar un poco como trabajamos en Godot Engine y como esta cambiando el paradigma.
  speaker:
    - name: "Emilio Coppola"
      bio: "Emilio Coppola es el director ejecutivo de la Godot Foundation y supervisa el desarrollo y la sostenibilidad del motor de código abierto. Con experiencia en desarrollo web y experiencia en empresas tecnológicas, pasó de crear juegos y contenido educativo para la comunidad Godot a liderar la Fundación. En su función, gestiona donaciones, asigna recursos e impulsa el crecimiento del motor manteniendo su naturaleza gratuita y de código abierto posicionándolo como una alternativa competitiva en la industria del desarrollo de video juegos."
