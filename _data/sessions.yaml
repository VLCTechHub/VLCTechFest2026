- startTime: "9:30"
  endTime: "10:30"
  room: Sala Polivalente
  language: "es"
  title: "La Techrreta: cómo es el ecosistema tech valenciano (y cómo nos gustaría que fuera)"
  description: |-
    Valencia lleva años peleando por ser el tercer hub tecnológico de España. Pero entre el relato optimista y los datos reales suele haber una brecha que nadie cuenta.

    Como llevo años acumulando datos en Manfred, me gustaría hablar de cómo es el ecosistema tech local: empresas, talento, contrataciones, salarios. Con Valencia como protagonista.

    Con los datos en la mano, quiero responder algunas preguntas: ¿puede Valencia competir con Madrid o Barcelona? ¿Qué perfiles técnicos concentra y cuáles le faltan? ¿Cómo comparan los salarios con Madrid o Barcelona?

    Pero los datos son solo la mitad. La otra mitad es la pregunta que me parece más interesante: ¿qué necesitamos para tener un ecosistema tech que merece? Una reflexión abierta, con la comunidad, sobre las palancas reales que podemos accionar.
  speaker:
    - name: "Borja Pérez"
      bio: "Marketing Lead en Manfred. Intento crear comunidad compartiendo datos, contexto del mercado tech y la visión desde Manfred."
      photo: /images/speakers/borjaPerez.jpg
      links:
        - https://www.linkedin.com/in/borjaperfra/
        - https://x.com/borjaperfra

- startTime: "9:30"
  endTime: "10:30"
  room: Sala Factoría
  language: "es"
  title: "Cómo usar la creatividad en tech, sin marear a las personas"
  description: |-
    «La accesibilidad es la muerte de la creatividad»; «No se puede ser creativo y accesible»; «Puede que esta página no sea accesible ni útil, ¡pero es porque es creativa!».

    ¿Cuántas veces has oído alguna de estas frases, o una combinación de ellas? En el mundo digital moderno, existe una tendencia a identificar «accesible» con «feo» y «sacrificio de la imaginación».

    Piccia Neri desmontará estos mitos en su charla, mostrando cómo los sitios web, las apps, y los negocios, pueden ser visibles, bonitos, creativos, accesibles y, al mismo tiempo, extremadamente rentables. Con consejos prácticos sobre cómo utilizar la animación de forma eficaz y accesible.
  speaker:
    - name: "Piccia Neri"
      bio: "Piccia Neri es diseñadora, consultora y formadora en experiencia de usuario (UX) y diseño accesible. Piccia dirige proyectos internacionales para empresas de todos los tamaños y forma a diseñadores, profesionales del marketing y desarrolladores para que sitúen la accesibilidad en el centro de su trabajo. Piccia imparte conferencias en todo el mundo y, actualmente, se propone demostrar que el diseño inclusivo no frena ni la creatividad ni la rentabilidad, sino que las potencia. "
      # photo: /images/speakers/aguedaMachado.jpg
      # links:

- startTime: "9:30"
  endTime: "10:30"
  room: Sala Visual
  language: "Talk in English 🇬🇧"
  title: "But I Have Nothing To Hide! Or How Big Techs and States made you believe so"
  description: |-
    Data collection has become something that is hard to avoid in our modern societies. From telemetry to sensible personal data, many companies and even state actors rely on it for carrying out their operations. But is it really an issue? After all, I have nothing to hide.

    What if I tell you that women were persecuted in the USA because they played to Candy Crush or used Tinder, and that their location data were sold to law enforcement which now criminalises people going to abortion clinics in some states? Or that it isn't that difficult to figure out the real identity of spies with publicly sold data for little money? And when the data isn't already available, state actors don't hesitate to hack their own population, including in democratic countries like France and Spain.

    Data collection has tangible impacts on our societies and democracies. Whether it's for making business profits or controlling its own population while weakening adversary countries, the goal is the same: control. And with the current AI trend, data collection is reaching unprecedented highs.

    So, what can we do about it in 2026? Thankfully, many technical and legal solutions exist, and we all have a role to play in it. Whether you are an entrepreneur, someone involved into the creation of a software, or a simple user, your choices can have a positive impact.

  speaker:
    - name: "Paul-Emmanuel Raoul"
      bio: "Self-educated since my childhood, I am a technology and science lover with a deep passion for IT, information security, and open-source software, and I am also obsessed with automation. I write software, create learning content about IT-related topics, and hunt for bugs. I work for myself and provide IT engineering services through SkypLabs."
      photo: /images/speakers/paulEmmanuel.jpeg
      links:
        - https://blog.skyplabs.net/
        - https://fosstodon.org/@Skyper
        - https://skyplabs.com/

- startTime: "10:30"
  endTime: "11:30"
  room: Sala Polivalente
  language: "Talk in English 🇬🇧"
  title: "Lessons from Building at Massive Scale"
  description: |-
    Building software at massive scale means designing systems that don’t just work—but continue to work under extreme load, unpredictable traffic spikes, and constant change.

    In this talk, I’ll share lessons from building and operating distributed systems at companies like Canva and Slack, where platforms handle trillions of requests and support millions of users in real time. We’ll focus on what it actually takes to design for resilience and reliability in high-pressure environments.

    This is a practical, experience-driven talk focused on the realities of operating systems at scale—where failure is inevitable, and resilience is designed.
  speaker:
    - name: "Javier Turégano"
      bio: |-
        Javier Turégano is a platform engineering leader with 20+ years of experience building and operating large-scale distributed systems. He has held senior roles at Canva and Slack, leading global platform and cloud engineering teams supporting products used by hundreds of millions of people.

        His work spans edge, identity, and service architectures, as well as reliability, data residency, and infrastructure at scale. Now an independent consultant and leadership coach, Javier advises companies on platform strategy and runs engineering leadership bootcamps for managers and Staff Engineers.

- startTime: "10:30"
  endTime: "11:30"
  room: Sala Factoría
  language: "es"
  title: "Desarrollo de modelos de IA conversacional para la identificación temprana de rasgos neurodivergentes"
  description: |-
    Imagina que, en lugar de acudir a una consulta a ser observado y rellenar un cuestionario, un amigo/a te pregunta: “¿Qué haríamos si nos cancelan un plan a última hora?”… y, sin que lo notes, no solo analiza tu respuesta, sino cómo la construyes, cuánto te desvías del tema, si haces preguntas de vuelta o cómo describes tus relaciones. A lo largo de una conversación aparentemente cotidiana, el sistema es capaz de detectar patrones sutiles en la comunicación, la reciprocidad social o la rigidez cognitiva, transformando el diálogo en una herramienta de observación estructurada.

    La inteligencia artificial conversacional está evolucionando rápidamente desde simples chatbots hacia sistemas capaces de analizar la interacción humana y detectar rasgos concretos. Esta charla presenta el desarrollo de modelos de IA conversacional orientados a la identificación temprana de neurodivergencias, explorando cómo una conversación natural y cotidiana puede convertirse en una herramienta para observar patrones de comunicación, interacción social, flexibilidad cognitiva o sensibilidad sensorial en contextos reales.

    A partir de un caso aplicado en el ámbito del Trastorno del Espectro Autista (TEA), se mostrará cómo es posible crear agentes conversacionales capaces de sostener interacciones naturalistas y adaptativas, alejadas de los cuestionarios tradicionales. El enfoque se basa en traducir marcos clínicos consolidados, como los criterios DSM-5 y herramientas de evaluación validadas, a arquitecturas conversacionales estructuradas que permiten recoger información relevante de forma más accesible, escalable y menos intrusiva.

    Durante la charla se explicará el proceso de creación de estos sistemas: desde el diseño de la lógica conversacional por fases (rapport, exploración y profundización), hasta la implementación de mecanismos de seguimiento interno que permiten analizar patrones en tiempo real y generar resultados interpretables. Se abordará cómo los modelos de lenguaje pueden integrar observación estructurada sin perder naturalidad en la interacción, y cómo este tipo de soluciones puede aplicarse en entornos educativos y de salud digital como apoyo a la detección temprana.
  speaker:
    - name: "Aitana Francés"
      bio: "Aitana Francés es Project Manager del Instituto Tecnológico de Producto Infantil y Ocio (AIJU). Está especializada en e-Health y tecnologías para la salud, centrando su trabajo en la aplicación de herramientas como inteligencia artificial (IA), realidad virtual (VR) y realidad aumentada (AR) para el desarrollo de soluciones dirigidas a personas no neurotípicas. Su actividad se orienta al diseño de propuestas innovadoras que favorecen la inclusión, el bienestar, la interacción y la mejora de la calidad de vida a través de la tecnología."
      photo: /images/speakers/aitanaFrances.jpeg
      links:
        - https://www.linkedin.com/in/aitana-francés-293a88208

- startTime: "10:30"
  endTime: "11:30"
  room: Sala Visual
  language: "es"
  title: "¿Hacemos Agile o solo hemos tuneado el Waterfall?"
  description: |-
    Si Agile iba de feedback temprano, adaptación y colaboración continua, ¿por qué tantos equipos siguen trabajando como si lo importante fuera cumplir un plan? En muchas organizaciones se sigue operando con una lógica sorprendentemente parecida al Waterfall de siempre. Hemos adoptado la parte visible de metodologías Agile, como los sprints, las dailies, las reviews o el backlog, pero no siempre la lógica de aprendizaje continuo, validación temprana y adaptación real que le daba sentido. Hemos tuneado la forma de organizar el trabajo, pero no necesariamente la forma de decidir, aprender y reaccionar.

    Todos conocemos conceptos del Product Management que, en teoría, deberían ayudarnos a aplicar mejor Agile. Hablar con usuarios para obtener feedback, medir para entender qué está pasando, trabajar por resultados y experimentar antes de invertir demasiado. El problema es que saberlo no basta. En la práctica, aplicarlo de verdad en el día a día es mucho más difícil de lo que parece. En esta charla veremos por qué pasa y, sobre todo, cómo empezar a hacerlo para aprender antes, iterar con más criterio y no seguir construyendo a ciegas. Y lo veremos también en un caso real, en el que una startup pasó de querer rehacer por completo su onboarding a mejorar su activación del 22% a más del 70% con cambios mínimos.

    El problema no era el onboarding. Era no haber entendido antes qué estaba pasando.
  speaker:
    - name: "Kiko Avellaneda"
      bio: "Kiko Avellaneda es Product Lead y autor del libro Haz Producto. Lleva años ayudando a equipos de desarrollo y startups a pasar de entregar funcionalidades a generar impacto real. En sus charlas conecta Agile, producto y desarrollo de software desde los problemas reales que viven los equipos en su día a día y cómo empezar a resolverlos de forma práctica."
      # photo: /images/speakers/ismaelCanal.jpeg
      # links:
      #   - https://ismael.fyi

