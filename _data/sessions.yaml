- startTime: "16:00"
  endTime: "17:00"
  room: Sala Factoría
  language: "Talk in English 🇬🇧"
  title: "Build trust, keep your job"
  description: |-
    Getting a job in tech is hard enough these days, but starting strong once you’re hired can be just as challenging. This talk looks at what helps new people build trust in their teams during those first critical months.

    Instead of focusing on interviews, CVs, or LinkedIn profiles, it shifts the attention to what happens after you join: how people around you decide whether they can rely on you, work with you, and give you more autonomy. Based on research in organizational psychology, the talk introduces three core ingredients of trust: ability, integrity, and benevolence.

    The session turns these ideas into practical, everyday actions that apply across the whole IT industry, from QA and engineering to product, design, and leadership roles.
  speaker:
    - name: "Asya Isakova"
      bio: "Asya is an organizational psychologist, scientist-practitioner, lecturer, and consultant working with IT teams and leaders. She’s been studying and practicing how to make work suck less since 2007 with various teams and leaders, including Firtune 500 companies. Lately, she’s been deeply into trust at work—bridging academia with hands-on leadership experience."
      # photo: /images/speakers/javierCasal.jpeg
      # links:
      #   - https://bsky.app/profile/javiercasal.bsky.social

- startTime: "16:00"
  endTime: "17:00"
  room: Sala Visual
  language: "es"
  title: "La dispersión como superpoder: Cómo la curiosidad puede hacerte mejor profesional"
  description: |-
    Tener muchos intereses y saltar de uno a otro tiene mala fama. Se le llama falta de foco, dispersión o no saber lo que quieres. En resumen, aprendiz de todo y maestro de nada.

    Quizá sea cierto, pero ¿y si te dijera que tu dispersión no es algo que debas corregir, sino el punto de partida de tu investigación?

    Ser generalista no es un problema, al contrario, creo que es lo más valioso que puedes ser ahora mismo, cuando la IA ya es la mejor especialista en cualquier sala de reuniones. Destacar por conectar ideas dispares, resolver problemas complejos, desenvolverse con éxito en entornos cambiantes... Suena bien, ¿no?

    En esta charla veremos herramientas concretas para tratar tus múltiples intereses con intención, para que dejen de ser motivo de tabú y se conviertan en material con el que trabajar, entre ellas el Mapa de la Curiosidad.
  speaker:
    - name: "Andrea Soler"
      bio: "Soy una creativa multidisciplinar, a falta de mejores palabras. Con estudios en Product Design, ahora trabajo como Visual Designer, pero en general diría que mi trabajo es solucionar problemas. Uso mi experiencia en diferentes áreas artísticas y técnicas para seguir creciendo como profesional, dejando que mi curiosidad me abra el camino."
      photo: /images/speakers/andreaSoler.png
      links:
        - https://www.linkedin.com/in/andreasolerparra

- startTime: "17:00"
  endTime: "18:00"
  room: Sala Polivalente
  language: "Talk in English 🇬🇧"
  title: "Why Female Role Models are Tech’s Greatest Untapped Asset"
  description: |-
    I'll be talking about my own experience as a woman in historically male environments - coordinator on a large hospital reconstruction, leading manager for the scalability of a surgical robotic manufacturing site, program manager in the Enterprise Data Office at AstraZeneca, and here in Valencia, building the Healthtech Community Valencia as both expath and a woman.

    The main idea is to show that the biggest impact on my career was made by other women in charge. I strived in my career while battling impostor syndrome, only because I saw what other women achieved, and they were always positive when I asked for help navigating the tech environment. As a result, I aimed to become that role model for my junior female peers.

    There are simple things we can do to help: never use misogyny to compete in a man's world, be a female ambassador  - always recommend another woman for the job, and share unwritten rules with female colleagues.
  speaker:
    - name: "Mariia Suleiman"
      bio: "I'm a tech enthusiast with 14 solid years of experience in HealthTech, Big Pharma, and Robotics - bringing amazing projects to life, while coaching female experts in originally very male environments. I evangelise the power of female role models in the tech world"
