- startTime: "12:00"
  endTime: "13:00"
  room: Sala Polivalente
  language: "Talk in English 🇬🇧"
  title: "TDD with AI: the veteran and the influencer who can’t agree (but still write tests)"
  description: |-
    A veteran who was writing tests before you were born and an influencer who turns every pull request into content. Together, improbably, they have something useful to teach you.

    In this talk we’re going to do what nobody asked us to do: sit down together to practice TDD with AI and show what happens when you run the red-green-refactor cycle with a copilot that sometimes hallucinates.

    We’ll talk about how to ask an AI for tests without it giving you something that passes but proves nothing. Why generated code also needs to be reviewed. The veteran has been saying this for decades, but now he’s right for new reasons. And when TDD with AI truly speeds things up—and when it just gives you the false confidence of seeing green bars.

    This isn’t a hype talk. We’re not going to tell you AI will replace anyone. We’re going to show you where it works, where it gets in the way, and why a developer’s judgment is still what separates a useful test from a decorative one.
  speaker:
    - name: "Emilio Carrión, Alex Fuentes"
      bio: |-
        Emilio Carrión: Staff Engineer at Mercadona Tech and PhD candidate at UPV. A technical content creator who turns every architecture decision into a LinkedIn post. Still convinced that code is a means, not an end—although sometimes the means costs him 45 minutes of scrolling.

        Alex Fuentes: Staff Frontend Engineer at Mercadona Tech. He’s been doing TDD with React for so many years that he no longer remembers how to program without writing a test first. He says AI is fine, but a good test is still better written by a person with coffee.
      # photo: /images/speakers/zeroycia.jpeg
      # links:
      #   - https://www.linkedin.com/in/jorge-borja-valdivia-249651bb/

- startTime: "12:00"
  endTime: "13:00"
  room: Sala Factoría
  language: "es"
  title: "Local-first to the limit: apps de alto rendimiento en el navegador"
  description: |-
    Hemos transformado una herramienta de modelado hidráulico (EPANET) con más de 30 años de historia, y pensada originalmente como aplicación de escritorio; en una aplicación web open source y local-first, donde todo corre directamente en la máquina del usuario.

    El navegador no está diseñado para este tipo de aplicaciones — pero cada vez hay menos impedimentos. Compartiremos cómo abordamos retos como: ejecutar cálculos y computación intensiva fuera del hilo principal, gestionar grandes volúmenes de datos en el navegador, flujos de trabajo “nativos” en un entorno web o elegir un buen formato de archivo para tu aplicación.

    También hablaremos de lo que sigue siendo difícil y de lo que realmente implica construir una aplicación que funcione completamente offline.

    Si te interesa llevar el navegador más allá de lo habitual, esta charla es para ti.
  speaker:
    - name: "Sandra Saornil, Sam Gathercole"
      bio: |-
        Sandra Saornil: "Empecé pelando cables y ayudando a físicos locos a descubrir nuevas partículas pero encontré mi oasis construyendo productos que solucionan problemas reales usando la cantidad mínima y justa de tecnología para ello. Me encontrarás priorizando proyectos con un impacto positivo en la sociedad y que me hagan sentir que sigo teniendo mucho por aprender."

        Sam Gathercoloe: "Mi trayectoria profesional abarca desde grandes empresas y startups hasta proyectos en etapas iniciales, lo que me ha dado una experiencia diversa en sectores como fintech, retail, monitoreo y sistemas hidráulicos. Ahora, estoy aprovechando todo ese bagaje para innovar en el modelado de redes hidráulicas a través de soluciones de código abierto."
      # photo: /images/speakers/javierMarti.jpeg
      # links:
        # - https://github.com/xabim

- startTime: "12:00"
  endTime: "13:00"
  room: Sala Visual
  language: "es"
  title: "Lo que la IA no ve cuando tu usuario tiene 3 años"
  description: |-
    ¿Qué pasa cuando tu usuario tiene 3 años y la IA no puede ayudarte a entenderlo?

    Cuando trabajas en el sector EdTech, y parte de tus usuarios son menores que ni saben leer, aprendes que ni los dashboards más sofisticados ni la IA más avanzada pueden sustituir ver a un/a niña/o intentar usar tu app sin saber leer ni expresar qué le frustra.

    En esta charla compartiré casos reales de esos momentos en los que te despegas de tu PC y tu mundo en pantallas, y observas a tus usuarios en su hábitat natural, y descubres que todas tus hipótesis no eran las más acertadas. Hablaré de por qué algunos problemas de producto solo se resuelven mirando, no midiendo. Y trataré de abordar la siguiente pregunta: en plena auge de la IA, ¿de verdad creemos que podemos hacer e iterar productos sin ver cómo los usa la gente real?
  speaker:
    - name: "Andrea López"
      bio: "Product Manager en la actualidad, y con mente de ingenieria informática. Me encanta ser PM por una razón simple: es uno de los roles donde realmente puedo hacer que los cambios sucedan. Empecé mi aventura laboral hace 13 años en el mundo corporativo, pero luego me pasé al mundo de las startups. Actualmente trabajo en una aplicación de juegos educativos para niños/as, siendo la única empresa española por la que the LEGO Foundation ha apostado."

- startTime: "13:00"
  endTime: "14:00"
  room: Sala Polivalente
  language: "es"
  title: "Cómo decidir cuando no hay datos, no hay tiempo y muchas opiniones"
  description: |-
    En producto, growth y tecnología, muchas de las decisiones más importantes se toman sin tener toda la información, con presión por avanzar y con múltiples opiniones compitiendo al mismo tiempo.

    Sin embargo, el problema no suele ser la falta de datos, sino cómo abordamos la toma de decisiones en contextos de incertidumbre. Equipos que analizan demasiado, prioridades que cambian constantemente y discusiones que no terminan, son síntomas de un problema más profundo: la ausencia de criterios claros para decidir.

    En esta charla compartiré cómo tomar decisiones cuando no hay respuestas evidentes, basándome en experiencias reales trabajando en entornos cross-funcionales donde la velocidad y la ambigüedad son la norma.

    Los asistentes se llevarán marcos mentales y herramientas prácticas que podrán aplicar inmediatamente para tomar decisiones con más claridad, velocidad y confianza, incluso en situaciones donde no existe una respuesta correcta.
  speaker:
    - name: "Maria Victoria Carrasco"
      bio: "Especialista en Growth, Estrategia de Producto y Operaciones, con experiencia liderando iniciativas cross-funcionales en entornos tech hace +15 años. Ayuda a equipos y líderes a destrabar problemas complejos y a generar impacto real en su negocio."
      photo: /images/speakers/maviCarrasco.png
      links:
        - https://www.linkedin.com/in/mavicarrasco
        - https://www.instagram.com/mavi.carrasco

- startTime: "13:00"
  endTime: "14:00"
  room: Sala Factoría
  language: "es"
  title: "Org Social: una red social descentralizada en un archivo de texto"
  description: |-
    ¿Qué es lo mínimo que necesitas para tener una red social? Un archivo de texto en un servidor web. Esa es la premisa de Org Social, un protocolo y ecosistema que he diseñado y construido desde cero para demostrar que la descentralización no requiere blockchain, federación compleja ni servidores dedicados. Sin bases de datos, sin cuentas, sin intermediarios.

    En esta charla recorreremos todo el camino: desde el diseño del protocolo basado en Org Mode (posts con timestamps, menciones, encuestas, hilos de respuesta, grupos y visibilidad), hasta la construcción del ecosistema completo de herramientas que lo hacen funcional.

    Más allá del código, hablaremos de las decisiones de diseño que definen el proyecto: por qué un archivo plano y no una base de datos, cómo se resuelve el problema del descubrimiento sin un servidor central, qué sacrificios implica apostar por la simplicidad radical, y qué hemos aprendido de protocolos anteriores. Si te interesa la descentralización, el software libre o simplemente quieres ver hasta dónde puedes llegar con un archivo de texto, esta charla es para ti.
  speaker:
    - name: "Andros Fenollosa"
      bio: "Full Stack Developer. Escribo artículos, libros y mantengo proyectos open source de todo tipo. Estoy orgulloso de ser el creador de Django LiveView, Org Social, entusiasta de Emacs, radioaficionado y amante de la programación funcional. "
      photo: /images/speakers/androsFenollosa.jpeg
      links:
        - https://andros.dev/

- startTime: "13:00"
  endTime: "14:00"
  room: Sala Visual
  language: "Talk in English 🇬🇧"
  title: "From Human-Driven to Autonomous Systems: Our Journey to an AI-Native SDLC"
  description: |-
    AI is changing how we write code, but what happens when software development becomes intent-driven? In this talk, we’ll share how we transformed our SDLC into an AI-native system where developers define intent and autonomous background agents execute, validate, and improve software continuously.

    These agents operate across sandbox environments, handling everything from flaky tests to production fixes. To make this possible, we built a standardized knowledge substrate for both humans and agents, redesigned our systems for machine consumption, evaluated yield instead of raw team throughput and rethought PCI/SOX/SOCII compliance boundaries.

    This is a practical story of what worked, what broke, and what it really takes to move toward an autonomous software factory.
  speaker:
    - name: "Luis Belloch"
      bio: "Luis Belloch es un ingeniero de software senior con más de 25 años de experiencia en el sector tecnológico. Actualmente ocupa el puesto de Senior Engineering Manager en Flywire, donde lidera equipos responsables del desarrollo del motor de pagos y su API pública, que procesan miles de transacciones internacionales cada día."
      # photo: /images/speakers/saraMartinez.jpeg
      # links:
      #   - www.testingsoul.com

