es:
  title: "🎉 After Party"
  description: La conferencia ha terminado, ¡pero la diversión no! Únete a nosotros en la azotea de Sesame para disfrutar de bebidas, música y buenas conversaciones bajo el cielo de Valencia.
  disclaimer: Para asistir a la fiesta, regístrate hablando con cualquiera de los organizadores durante el evento. El aforo está limitado a 80 personas, así que no te olvides de apuntarte si quieres venir.
  map_link_text: Ver mapa más grande

en:
  title: "🎉 After Party"
  description: The conference is over, but the fun isn't! Join us at Sesame's rooftop for drinks, music, and great conversations under the Valencia sky.
  disclaimer: To attend the after party, please sign up by talking to any of the organizers during the event. Space is limited to 80 people, so don't forget to sign up if you want to come!
  map_link_text: View larger map

ca:
  title: "🎉 After Party"
  description: La conferència ha acabat, però la diversió no! Uneix-te a nosaltres a la terrassa de Sesame per gaudir de begudes, música i bones converses sota el cel de València.
  disclaimer: Per assistir a la festa, registra't parlant amb qualsevol dels organitzadors durant l'esdeveniment. L'aforament està limitat a 80 persones, així que no t'oblides d'apuntar-t'hi si vols vindre!
  map_link_text: Veure mapa més gran
